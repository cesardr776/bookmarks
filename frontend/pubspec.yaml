name: moda_ia
description: Transform clothing photos into professional e-commerce images with AI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  firebase_storage: ^12.1.0
  google_sign_in: ^6.2.1

  # HTTP
  http: ^1.2.1
  dio: ^5.4.3+1

  # Image handling
  image_picker: ^1.1.0
  cached_network_image: ^3.3.1
  flutter_image_compress: ^2.2.0

  # UI
  go_router: ^14.1.4
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Utils
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
