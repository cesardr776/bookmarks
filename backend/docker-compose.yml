version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: moda-ia-backend:latest
    container_name: moda-ia-backend
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persist generated images across container restarts
      - moda_ia_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; httpx.get('http://localhost:8000/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  moda_ia_storage:
