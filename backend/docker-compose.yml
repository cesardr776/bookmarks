version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: moda-ia-api:latest
    container_name: moda-ia-api
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Uncomment to run locally with Nginx reverse proxy
